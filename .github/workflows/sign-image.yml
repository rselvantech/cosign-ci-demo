name: sign-image
on:
  workflow_dispatch:               # start the run by hand from the Actions tab
permissions:
  contents: read                   # read-only is enough; nothing is checked out
  packages: write                  # push the image to GHCR with the job's own token
  id-token: write                  # lets the job request the OIDC token Fulcio accepts
jobs:
  build-and-sign:
    runs-on: ubuntu-24.04          # a fixed runner image, not a moving label
    steps:
      - name: Install pinned Cosign (checksum-verified)
        run: |
          set -euo pipefail
          VERSION=v3.1.3
          curl -fsSL -O "https://github.com/sigstore/cosign/releases/download/${VERSION}/cosign-linux-amd64"
          curl -fsSL -O "https://github.com/sigstore/cosign/releases/download/${VERSION}/cosign_checksums.txt"
          grep " cosign-linux-amd64\$" cosign_checksums.txt | sha256sum -c -
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
          cosign version
      - name: Build and push a small image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/cosign-demo03"
          mkdir ctx
          printf 'FROM scratch\nCOPY app.txt /app.txt\n' > ctx/Dockerfile
          echo "built by workflow run ${GITHUB_RUN_ID}" > ctx/app.txt
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -t "${IMAGE}:ci" ctx
          docker push "${IMAGE}:ci" | tee push.log
          DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -1)"
          echo "IMAGE_REF=${IMAGE}@${DIGEST}" >> "${GITHUB_ENV}"
      - name: Sign by digest (keyless, ambient GitHub identity)
        run: cosign sign --yes "${IMAGE_REF}"
      - name: Print the reference to verify
        run: echo "${IMAGE_REF}"
